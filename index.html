<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sokoban - Nivel 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Sokoban</h1>
    <h2>Nivel 1</h2>
    <p>Usa WASD, las flechas o desliza para empujar.</p>

    <div id="game-board"></div>
    <div id="win-message">¡Nivel Completado! 🎉</div>

    <div class="controls">
        <div></div><button onclick="handleMove(-1, 0)">⬆️</button><div></div>
        <button onclick="handleMove(0, -1)">⬅️</button>
        <button onclick="handleMove(1, 0)">⬇️</button>
        <button onclick="handleMove(0, 1)">➡️</button>
    </div>

    <div class="action-buttons">
        <button class="btn btn-undo" onclick="undo()">↩️ Deshacer</button>
        <button class="btn btn-restart" onclick="initGame()">🔄 Reiniciar</button>
        <button id="btn-next" class="btn btn-next">Siguiente ➡️</button>
    </div>

    <!-- AQUÍ SE DEFINE EL MAPA Y EL SIGUIENTE NIVEL -->
    <script>
        const levelMap = [
            "######",
            "#    #",
            "# @$ #",
            "#  . #",
            "######"
        ];
        const nextLevelUrl = "nivel2.html"; // Al ganar, irá a este archivo
    </script>
    
    <!-- Cargar la lógica del juego -->
    <script src="game.js"></script>
</body>
</html>
