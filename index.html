<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sokoban en un Archivo</title>
    <style>
        :root {
            --wall-color: #7f8c8d;
            --floor-color: #ecf0f1;
            --box-color: #e67e22;
            --box-border: #d35400;
            --box-done: #2ecc71;
            --box-done-border: #27ae60;
            --player-color: #3498db;
            --goal-color: #e74c3c;
        }

        body {
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding-top: 30px;
        }

        h1 { margin-bottom: 5px; }
        p { color: #bdc3c7; margin-bottom: 20px; text-align: center; max-width: 400px;}

        #game-board {
            display: grid;
            background-color: #34495e;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            gap: 2px;
        }

        .cell {
            width: 40px;
            height: 40px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wall {
            background-color: var(--wall-color);
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .floor {
            background-color: var(--floor-color);
            border-radius: 4px;
        }

        /* Indicador del objetivo */
        .goal::after {
            content: '';
            width: 12px;
            height: 12px;
            background-color: var(--goal-color);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 5px rgba(231, 76, 60, 0.8);
        }

        /* Caja normal */
        .box {
            width: 32px;
            height: 32px;
            background-color: var(--box-color);
            border: 3px solid var(--box-border);
            border-radius: 4px;
            position: absolute;
            z-index: 10;
            box-sizing: border-box;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
        }

        /* Caja en el objetivo */
        .box.on-goal {
            background-color: var(--box-done);
            border-color: var(--box-done-border);
        }

        /* Jugador */
        .player {
            width: 28px;
            height: 28px;
            background-color: var(--player-color);
            border-radius: 50%;
            position: absolute;
            z-index: 20;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            gap: 10px;
            margin-top: 20px;
        }

        .controls button {
            width: 50px;
            height: 50px;
            font-size: 20px;
            background-color: #95a5a6;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px #7f8c8d;
        }

        .controls button:active {
            box-shadow: 0 0 #7f8c8d;
            transform: translateY(4px);
        }

        .btn-restart {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .btn-restart:hover { background-color: #c0392b; }
        
        #win-message {
            display: none;
            color: #2ecc71;
            font-size: 24px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Sokoban</h1>
    <p>Usa las flechas del teclado o los botones en pantalla para empujar todas las cajas hacia los puntos rojos.</p>

    <div id="game-board"></div>
    
    <div id="win-message">¡Nivel Completado! 🎉</div>

    <!-- Controles móviles/mouse -->
    <div class="controls">
        <div></div>
        <button onclick="handleMove(-1, 0)">⬆️</button>
        <div></div>
        <button onclick="handleMove(0, -1)">⬅️</button>
        <button onclick="handleMove(1, 0)">⬇️</button>
        <button onclick="handleMove(0, 1)">➡️</button>
    </div>

    <button class="btn-restart" onclick="initGame()">Reiniciar Nivel</button>

    <script>
        // Leyenda del mapa:
        // '#' = Pared, ' ' = Piso, '.' = Objetivo
        // '$' = Caja, '@' = Jugador
        const initialMap = [
            "########",
            "#   .  #",
            "#   $  #",
            "# .$@$.#",
            "#   $  #",
            "#   .  #",
            "########"
        ];

        let grid = [];
        let playerPos = { r: 0, c: 0 };
        let gameWon = false;

        function initGame() {
            gameWon = false;
            document.getElementById('win-message').style.display = 'none';
            
            // Clonar el mapa inicial en una matriz 2D
            grid = initialMap.map(row => row.split(''));
            
            // Encontrar la posición inicial del jugador
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    if (grid[r][c] === '@' || grid[r][c] === '+') {
                        playerPos = { r, c };
                    }
                }
            }
            render();
        }

        function render() {
            const board = document.getElementById('game-board');
            board.style.gridTemplateColumns = `repeat(${grid[0].length}, 40px)`;
            board.innerHTML = '';

            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    const char = grid[r][c];

                    // Fondo base (Pared o Piso)
                    if (char === '#') cell.classList.add('wall');
                    else cell.classList.add('floor');

                    // Marcas de objetivo (puntos rojos)
                    if (char === '.' || char === '*' || char === '+') {
                        cell.classList.add('goal');
                    }

                    // Entidades: Cajas
                    if (char === '$' || char === '*') {
                        const box = document.createElement('div');
                        box.classList.add('box');
                        if (char === '*') box.classList.add('on-goal');
                        cell.appendChild(box);
                    }

                    // Entidades: Jugador
                    if (char === '@' || char === '+') {
                        const player = document.createElement('div');
                        player.classList.add('player');
                        cell.appendChild(player);
                    }

                    board.appendChild(cell);
                }
            }
        }

        // Lógica de movimiento
        window.addEventListener('keydown', (e) => {
            if (gameWon) return;
            let dr = 0, dc = 0;
            
            if (e.key === 'ArrowUp') dr = -1;
            else if (e.key === 'ArrowDown') dr = 1;
            else if (e.key === 'ArrowLeft') dc = -1;
            else if (e.key === 'ArrowRight') dc = 1;
            else return; // Ignorar otras teclas

            e.preventDefault(); // Prevenir el scroll de la página
            handleMove(dr, dc);
        });

        function handleMove(dr, dc) {
            if (gameWon) return;

            let nr = playerPos.r + dr;
            let nc = playerPos.c + dc;

            // Evitar salir de los límites de la matriz
            if (nr < 0 || nr >= grid.length || nc < 0 || nc >= grid[0].length) return;

            let target = grid[nr][nc];

            // Chocar contra pared
            if (target === '#') return;

            // Moverse a espacio vacío u objetivo
            if (target === ' ' || target === '.') {
                updatePlayerPos(nr, nc);
            } 
            // Empujar una caja
            else if (target === '$' || target === '*') {
                let nnr = nr + dr;
                let nnc = nc + dc;
                let pushTarget = grid[nnr][nnc];

                // Si el espacio detrás de la caja está libre o es un objetivo
                if (pushTarget === ' ' || pushTarget === '.') {
                    // Mover la caja
                    grid[nnr][nnc] = pushTarget === '.' ? '*' : '$';
                    // Dejar el piso libre u objetivo donde estaba la caja
                    grid[nr][nc] = target === '*' ? '.' : ' ';
                    
                    // Mover al jugador
                    updatePlayerPos(nr, nc);
                    checkWin();
                }
            }
        }

        function updatePlayerPos(nr, nc) {
            // Limpiar la posición actual del jugador
            let currentCell = grid[playerPos.r][playerPos.c];
            grid[playerPos.r][playerPos.c] = currentCell === '+' ? '.' : ' ';

            // Asignar al jugador en la nueva posición
            let newCell = grid[nr][nc];
            grid[nr][nc] = newCell === '.' ? '+' : '@';

            playerPos = { r: nr, c: nc };
            render();
        }

        function checkWin() {
            let boxesRemaining = false;
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    if (grid[r][c] === '$') {
                        boxesRemaining = true;
                    }
                }
            }
            
            if (!boxesRemaining) {
                gameWon = true;
                document.getElementById('win-message').style.display = 'block';
            }
        }

        // Iniciar el juego al cargar la página
        initGame();
    </script>
</body>
</html>
