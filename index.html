<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sokoban - 5 Niveles</title>
    <style>
        :root {
            --wall-color: #7f8c8d;
            --floor-color: #ecf0f1;
            --box-color: #e67e22;
            --box-border: #d35400;
            --box-done: #2ecc71;
            --box-done-border: #27ae60;
            --player-color: #3498db;
            --goal-color: #e74c3c;
        }

        body {
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding-top: 20px;
        }

        h1 { margin-bottom: 0px; }
        h2 { margin-top: 5px; color: #f39c12; font-size: 1.2rem; }
        p { color: #bdc3c7; margin-bottom: 20px; text-align: center; max-width: 400px; font-size: 0.9rem;}

        #game-board {
            display: grid;
            background-color: #34495e;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            gap: 2px;
        }

        .cell {
            width: 40px;
            height: 40px;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wall {
            background-color: var(--wall-color);
            border-radius: 4px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.3);
        }

        .floor {
            background-color: var(--floor-color);
            border-radius: 4px;
        }

        .goal::after {
            content: '';
            width: 12px;
            height: 12px;
            background-color: var(--goal-color);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 5px rgba(231, 76, 60, 0.8);
        }

        .box {
            width: 32px;
            height: 32px;
            background-color: var(--box-color);
            border: 3px solid var(--box-border);
            border-radius: 4px;
            position: absolute;
            z-index: 10;
            box-sizing: border-box;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        .box.on-goal {
            background-color: var(--box-done);
            border-color: var(--box-done-border);
        }

        .player {
            width: 28px;
            height: 28px;
            background-color: var(--player-color);
            border-radius: 50%;
            position: absolute;
            z-index: 20;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.4);
            transition: transform 0.1s;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 50px);
            gap: 10px;
            margin-top: 20px;
        }

        .controls button {
            width: 50px;
            height: 50px;
            font-size: 20px;
            background-color: #95a5a6;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px #7f8c8d;
        }

        .controls button:active {
            box-shadow: 0 0 #7f8c8d;
            transform: translateY(4px);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            height: 40px;
        }

        .btn {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .btn-restart { background-color: #e74c3c; color: white; }
        .btn-restart:hover { background-color: #c0392b; }
        
        .btn-next { background-color: #2ecc71; color: white; display: none; }
        .btn-next:hover { background-color: #27ae60; }
        
        #win-message {
            display: none;
            color: #2ecc71;
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Sokoban</h1>
    <h2>Nivel <span id="level-display">1</span> / 5</h2>
    <p>Empuja las cajas ($) hacia los puntos rojos (.). Evita arrinconarlas.</p>

    <div id="game-board"></div>
    
    <div id="win-message">¡Nivel Completado! 🎉</div>

    <div class="controls">
        <div></div>
        <button onclick="handleMove(-1, 0)">⬆️</button>
        <div></div>
        <button onclick="handleMove(0, -1)">⬅️</button>
        <button onclick="handleMove(1, 0)">⬇️</button>
        <button onclick="handleMove(0, 1)">➡️</button>
    </div>

    <div class="action-buttons">
        <button class="btn btn-restart" onclick="loadLevel(currentLevelIndex)">Reiniciar Nivel</button>
        <button id="btn-next" class="btn btn-next" onclick="nextLevel()">Siguiente Nivel ➡️</button>
    </div>

    <script>
        // Array con los 5 niveles (de muy fácil a difícil)
        const levels = [
            // Nivel 1: Tutorial
            [
                "######",
                "#    #",
                "# @$ #",                 "#  . #",                 "######"             ],             // Nivel 2: Fácil - Pensar antes de empujar             [                 "#######",                 "#     #",                 "#  .  #",                 "# $ $ #",
                "#  .  #",
                "#  @  #",
                "#######"
            ],
            // Nivel 3: Medio - La cruz simétrica
            [
                "########",
                "#   .  #",
                "#   $  #",
                "# .$@$.#",
                "#   $  #",
                "#   .  #",
                "########"
            ],
            // Nivel 4: Medio-Alto - Espacios reducidos
            [
                "########",
                "#      #",
                "# . $  #",
                "# .$@. #",
                "#  $   #",
                "#      #",
                "########"
            ],
            // Nivel 5: Difícil - Bloque de cajas
            [
                "########",
                "#      #",
                "# .  . #",
                "#  $$  #",                 "#  $$  #",
                "# .  . #",
                "#  @   #",
                "########"
            ]
        ];

        let currentLevelIndex = 0;
        let grid = [];
        let playerPos = { r: 0, c: 0 };
        let gameWon = false;

        function loadLevel(index) {
            currentLevelIndex = index;
            gameWon = false;
            
            // Actualizar UI
            document.getElementById('level-display').innerText = currentLevelIndex + 1;
            document.getElementById('win-message').style.display = 'none';
            document.getElementById('btn-next').style.display = 'none';
            
            // Clonar el mapa para poder modificarlo
            grid = levels[currentLevelIndex].map(row => row.split(''));
            
            // Buscar al jugador
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    if (grid[r][c] === '@' || grid[r][c] === '+') {
                        playerPos = { r, c };
                    }
                }
            }
            render();
        }

        function nextLevel() {
            if (currentLevelIndex < levels.length - 1) {
                loadLevel(currentLevelIndex + 1);
            }
        }

        function render() {
            const board = document.getElementById('game-board');
            board.style.gridTemplateColumns = `repeat(${grid[0].length}, 40px)`;
            board.innerHTML = '';

            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    const char = grid[r][c];

                    // Pared o Piso
                    if (char === '#') cell.classList.add('wall');
                    else cell.classList.add('floor');

                    // Marcas de objetivo
                    if (char === '.' || char === '*' || char === '+') {
                        cell.classList.add('goal');
                    }

                    // Cajas
                    if (char === '$' || char === '*') {
                        const box = document.createElement('div');
                        box.classList.add('box');
                        if (char === '*') box.classList.add('on-goal');
                        cell.appendChild(box);
                    }

                    // Jugador
                    if (char === '@' || char === '+') {
                        const player = document.createElement('div');
                        player.classList.add('player');
                        cell.appendChild(player);
                    }

                    board.appendChild(cell);
                }
            }
        }

        // Lógica de movimiento por teclado
        window.addEventListener('keydown', (e) => {
            if (gameWon) return;
            let dr = 0, dc = 0;
            
            if (e.key === 'ArrowUp') dr = -1;
            else if (e.key === 'ArrowDown') dr = 1;
            else if (e.key === 'ArrowLeft') dc = -1;
            else if (e.key === 'ArrowRight') dc = 1;
            else return; 

            e.preventDefault(); 
            handleMove(dr, dc);
        });

        function handleMove(dr, dc) {
            if (gameWon) return;

            let nr = playerPos.r + dr;
            let nc = playerPos.c + dc;

            if (nr < 0 || nr >= grid.length || nc < 0 || nc >= grid[0].length) return;
            let target = grid[nr][nc];

            if (target === '#') return;

            if (target === ' ' || target === '.') {
                updatePlayerPos(nr, nc);
            } 
            else if (target === '$' || target === '*') {
                let nnr = nr + dr;
                let nnc = nc + dc;
                let pushTarget = grid[nnr][nnc];

                if (pushTarget === ' ' || pushTarget === '.') {
                    // Mover caja
                    grid[nnr][nnc] = pushTarget === '.' ? '*' : '$';
                    grid[nr][nc] = target === '*' ? '.' : ' ';
                    
                    updatePlayerPos(nr, nc);
                    checkWin();
                }
            }
        }

        function updatePlayerPos(nr, nc) {
            let currentCell = grid[playerPos.r][playerPos.c];
            grid[playerPos.r][playerPos.c] = currentCell === '+' ? '.' : ' ';

            let newCell = grid[nr][nc];
            grid[nr][nc] = newCell === '.' ? '+' : '@';

            playerPos = { r: nr, c: nc };
            render();
        }

        function checkWin() {
            let boxesRemaining = false;
            for (let r = 0; r < grid.length; r++) {
                for (let c = 0; c < grid[r].length; c++) {
                    if (grid[r][c] === '$') {
                        boxesRemaining = true; // Todavía hay cajas fuera de objetivo
                    }
                }
            }
            
            if (!boxesRemaining) {
                gameWon = true;
                const msg = document.getElementById('win-message');
                msg.style.display = 'block';
                
                if (currentLevelIndex < levels.length - 1) {
                    msg.innerText = '¡Nivel Completado! 🎉';
                    document.getElementById('btn-next').style.display = 'block';
                } else {
                    msg.innerText = '🏆 ¡Felicidades! Has completado todos los niveles. 🏆';
                }
            }
        }

        // Iniciar el juego en el nivel 1
        loadLevel(0);
    </script>
</body>
</html>
